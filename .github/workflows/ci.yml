name: lmpy

# Builds the lmpy executable on five platforms, runs native/test.sh (system-libraries-only check, schema/API drift, signature
# parity with the lmscript compiler, every examples/dsl program), and on a v* tag attaches to the GitHub release: the bare
# executables lmpy-OS-ARCH[.exe] (lmscript's `_dsl_ install=` downloads these, verified by the asset digest), one archive per
# platform (executable, schema, API reference, licences), the schema itself and SHA256SUMS.
# Linux builds run in manylinux_2_28 containers so the binary needs only glibc >= 2.28 (RHEL 8, Debian 10, Ubuntu 18.10 and
# later); everything else (libstdc++, Eigen, Boost, HiGHS, ...) is linked in. No Python is installed or used.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "**.md"]
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single platform (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

permissions:
  contents: read

concurrency:
  group: lmpy-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LMCTL_VERSION: 0.2.359   # lmscript with _dsl_ bytecode v5, cli= (R42) and install= (R43)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64,   container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: ubuntu-24.04-arm, name: linux-arm64, container: "quay.io/pypa/manylinux_2_28_aarch64" }
          - { os: macos-15,         name: macos-arm64, container: "" }
          - { os: macos-15-intel,   name: macos-x64,   container: "" }
          - { os: windows-2022,     name: windows-x64, container: "" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false

      - name: toolchain (linux, manylinux_2_28)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: |
          pipx install ninja >/dev/null 2>&1 || python3 -m pip install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gcc --version | sed -n 1p; cmake --version | sed -n 1p; ldd --version | sed -n 1p

      - name: toolchain (macos)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja

      - name: toolchain (windows, MinGW-w64)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            for i in 1 2 3; do choco install -y mingw ninja && break; echo "choco attempt $i failed"; sleep 20; done
          fi
          g++ --version | sed -n 1p

      - name: cache third-party sources and the HiGHS build
        if: env.ONLY_OK == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/.deps
          key: deps-${{ matrix.name }}-${{ hashFiles('native/deps.lock', 'native/scripts/fetch-deps.sh') }}

      - name: fetch pinned dependencies (sha256-checked) and build HiGHS
        if: env.ONLY_OK == 'true'
        run: native/scripts/fetch-deps.sh

      - name: lmscript compiler (npm @lmctl-ai/lmctl)
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install lmscript
        if: env.ONLY_OK == 'true'
        run: |
          npm i -g "@lmctl-ai/lmctl@${LMCTL_VERSION}"
          lmscript --version

      - name: build and test (native/test.sh)
        if: env.ONLY_OK == 'true'
        run: native/test.sh

      - name: package
        if: env.ONLY_OK == 'true'
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          pkg="lmpy-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "native/build/lmpy$ext" "dist/$pkg/"
          cp native/schema/lmpy.dsl.json native/API.md native/README.md native/THIRD_PARTY_NOTICES.md LICENSE "dist/$pkg/"
          cp -r native/licenses "dist/$pkg/licenses"
          # the bare executable, named PROGRAM-OS-ARCH[.exe]: what lmscript `_dsl_ cli="lmpy" install="github:lmctl-ai/lmpy@TAG"` downloads
          cp "native/build/lmpy$ext" "dist/lmpy-${{ matrix.name }}$ext"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$pkg.zip" "$pkg" >/dev/null; else tar -czf "$pkg.tar.gz" "$pkg"; fi
          rm -rf "$pkg"
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmpy-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmpy-*
          path: dist
          merge-multiple: true
      - name: checksums and the schema as separate assets
        run: |
          cp native/schema/lmpy.dsl.json dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: attach to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "lmpy $GITHUB_REF_NAME" --generate-notes dist/*
          fi
